name: Release

on:
  push:
    tags: 
      - 'v*'

# Queue release jobs so they always release in order
concurrency:
  group: release
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # To write the GitHub release
      id-token: write # To publish to NPM with provenance

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full branch/tag history for the release notes
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Build for release
      - name: Build
        run: npm run build

      # Publish with provenance, then create the GitHub release
      # with auto-generated release notes
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm publish --provenance --access public
          npx changelogithub --no-emoji --no-contributors
